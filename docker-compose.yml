services:
  app:
    build: .
    restart: unless-stopped
    # el DNS del ISP no resuelve streamed.pk
    dns: [1.1.1.1, 8.8.8.8]
    ports:
      - "83:83"
    environment:
      STREAMED_API_BASE: ${STREAMED_API_BASE:-https://streamed.pk/api}
      STREAMED_IMG_BASE: ${STREAMED_IMG_BASE:-https://streamed.pk}
      PELOTALIBRE_AGENDA_URL: ${PELOTALIBRE_AGENDA_URL:-https://pelotalibre.la/agenda.php}
      PELISJUANITA_AGENDA_URL: ${PELISJUANITA_AGENDA_URL:-https://pelisjuanita.com/tv/api-agenda.php}
